[project]
name = "seagent-asr"
version = "1.0.0"
description = "水下多智能体任务决策大模型与 ASR 融合接口系统"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Google DeepMind Advanced Agentic Coding Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyYAML>=6.0.1",
    "Flask>=3.0.0",
    "Werkzeug>=3.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "networkx>=3.2",
    "cn2an>=0.5.22",
    "dateparser>=1.2",
]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | \.agents
)/
'''

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "mcp/ros-mcp/tests",
    "mcp/operation-time-window/tests_unit",
    "mcp/operation-time-window/tests_mcp",
]
asyncio_mode = "auto"
markers = [
    "integration: live remote tests (RUN_COPERNICUS_LIVE_TEST=1 required)",
    "external_comparison: optional external ROS libraries (SEAGENT_RUN_EXTERNAL_COMPARISON=1 required)",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["scratch", ".agents", "fixtures"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The runtime imports the package as ``src.*``. Keep that package name in the
# distribution instead of flattening its children into top-level packages.
package-dir = {"" = "."}
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = [
    "scratch*",
    ".agents*",
    "*.tests*",
]

[tool.setuptools.exclude-package-data]
"*" = [
    "*.pyc",
    "__pycache__/*",
    ".DS_Store",
]

[project.optional-dependencies]
cn2an = [
    "cn2an>=0.5.22",
]
chinese-numbers = [
    "cn2an>=0.5.22",
]
test = [
    "requests>=2.28.0",
    "pytest>=9.0",
    "pytest-asyncio>=0.21.0",
    "mcp>=1.27.0,<2",
    "fastmcp>=2.0.0,<4",
    "websocket-client>=1.6",
    "websockets>=14.0",
]
gpu = [
    "torch",
    "transformers",
    "accelerate",
    "vllm",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/example/seagent-asr"
Issues = "https://github.com/example/seagent-asr/issues"
