  <text x="35" y="270" text-anchor="middle" transform="rotate(-90 35 270)" font-family="sans-serif" font-size="15" fill="#333">odom Y (m)</text>
  <line x1="665" y1="190" x2="225" y2="390" stroke="#1f77b4" stroke-width="6"/>
