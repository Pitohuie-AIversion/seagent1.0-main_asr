name: SEAgent CI & Regression Verification

on:
  push:
    branches: [ main, "phase*", "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  full-suite-tests:
    name: Mandatory Full Test Suite & Regression Audit Gate
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      SEAGENT_RESULT_DIR: ${{ github.workspace }}/result

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt

      - name: 1. Python Syntax & Compilation Check
        run: python -m compileall -q src tests

      - name: 2. Run Full Test Suite & Generate Audit Data
        run: |
          set +e
          TRANSFORMERS_OFFLINE=1 HF_HUB_OFFLINE=1 python -m unittest discover tests -v 2>&1 | tee full_test.log
          test_exit=${PIPESTATUS[0]}
          set -e
          
          python scratch/parse_tests.py || true
          python scratch/generate_report.py || true
          
          echo "Full test suite exited with code ${test_exit}"
          exit "${test_exit}"

      - name: Upload Regression Report & Test Log Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-audit-report
          path: |
            docs/regression_report.md
            full_test.log
            /tmp/test_records.json

