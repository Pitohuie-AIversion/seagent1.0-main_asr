# config/model_profiles.yaml — ModelProfile Capability Governance Configuration
schema_version: 1

# 双卡与多后端计算引擎配置
backends:
  gpu0_fast:
    type: "local_vllm"
    device: "cuda:0"
    model_path: "/root/autodl-tmp/model/Qwen3.5-9B"
    description: "GPU 0 本地快速推理引擎 (9B/ASR)"
  gpu1_heavy:
    type: "openai_http"
    base_url: "http://127.0.0.1:8001/v1"
    model_name: "qwen27b"
    description: "GPU 1 独立 vLLM 深度思考服务 (27B-FP8)"

profiles:
  router:
    role: router
    backend: gpu0_fast
    enable_thinking: false
    temperature: 0.1
    max_tokens: 260
    stop: []
    response_mode: json

  extractor:
    role: extractor
    backend: gpu0_fast
    enable_thinking: false
    tools_enabled: true
    temperature: 0.1
    max_tokens: 1600
    stop: []
    response_mode: json

  task_responder:
    role: task_responder
    backend: gpu0_fast
    enable_thinking: false
    temperature: 0.7
    max_tokens: 1500
    stop: []
    response_mode: text

  knowledge_qa:
    role: knowledge_qa
    backend: gpu0_fast
    enable_thinking: false
    temperature: 0.1
    max_tokens: 1500
    stop: []
    response_mode: text

  general_reasoning:
    role: general_reasoning
    backend: gpu1_heavy
    enable_thinking: true
    temperature: 0.7
    max_tokens: 1500
    stop: []
    response_mode: text

  filter_reply:
    role: filter_reply
    backend: gpu0_fast
    enable_thinking: false
    temperature: 0.7
    max_tokens: 1500
    stop: []
    response_mode: text

  translation:
    role: translation
    backend: gpu0_fast
    enable_thinking: false
    temperature: 0.1
    max_tokens: 1500
    stop: []
    response_mode: text
