# DVL底锁失效风险区（作业需谨慎，做好应急措施）
dvl_bottom_lock_failure_areas:
  # =====================================
  # 南海北部深水陆坡沉积与内潮风险区
  # =====================================
  - id: "dvl_failure_south_china_sea_northern_slope"
    name: "南海北部陆坡DVL底锁风险区"
    aliases: ["南海北部陆坡DVL风险区", "南海陆坡DVL底锁风险区", "南海北部深水DVL风险区", "南海北部陆坡底锁风险区"]
    lat_range: [18.00, 19.50]
    lon_range: [112.00, 113.00]
    provenance:
      authority: "internal_simulation"
      boundary_basis: "基于区域沉积和内潮风险的工程提示框；不是DVL确定失效边界"
    notes: >
      南海北部陆坡存在复杂沉积环境和强内潮动力过程。内潮及底边界层流动可导致海底沉积物再悬浮，改变近底声学传播环境，增加水下声学导航设备底锁稳定性风险。
      该区域仅用于风险提示，不作为DVL失效确定区域；作业前仍需结合实际海床声学资料和DVL质量指标判断。


