      珠江口盆地属于南海北部重要沉积盆地，发育厚层海相沉积，深水区域可能存在低速沉积层和复杂海底声学传播环境。
      该区域仅用于风险提示，不作为DVL失效确定区域；作业前需获取实际作业点海床声学和地质资料。


