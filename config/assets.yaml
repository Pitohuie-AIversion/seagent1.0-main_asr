    common:
        - "多功能液压机械臂"
        - "电液机械臂"
        - "双目视觉模块"
        - "激光标尺"
        - "三维视觉系统"
        - "机械式声呐"
        - "USBL定位设备"
        - "夹爪"
        - "清洗刷"
        - "采样器"
        - "切割工具"
        - "液压剪切器"
        - "温度传感器"
        - "压力传感器"
        - "泄漏检测传感器"
        - "水质传感器"
    description: "采油树阀门插拔常用工具，建议根据插拔目的选择组合"


