    capabilities: ["超高分辨率成像", "大范围扫测", "细微目标识别"]

  sub_bottom_profiler:
    name: "浅地层剖面仪"
    aliases: ["浅地层剖面仪", "SBP", "浅剖仪", "地层剖面声呐"]
    description: "发射低频声波穿透海底沉积物，获取海床下方数十米地层构造与埋藏物剖面的声学调查设备。"
    capabilities: ["浅地层剖面探测", "海底地质调查", "埋藏管缆探测"]

  ctd_sensor:
    name: "CTD"
    aliases: ["CTD", "温盐深仪", "温度传感器", "压力传感器"]
    description: "高精度测量水体电导率（盐度）、温度和深度（压力）的水文测量传感器，为声学设备声速校正提供环境背景参数。"
    capabilities: ["水温测量", "水压深度测量", "盐度计算", "声速校正"]

  optical_measurement_module:
    name: "光学测量模块"
    aliases: ["光学测量模块", "光学测量系统", "视觉测量模块"]
    description: "集成高分辨率光学相机与激光测距标尺的综合测量套件，用于精确评估水下结构件几何尺寸与缺陷。"
    capabilities: ["尺寸测量", "光学巡检", "缺陷评估"]

  water_quality_sensor_suite:
    name: "水质传感器"
    aliases: ["水质传感器", "浊度传感器", "溶解氧传感器", "水质监测系统"]
    description: "用于测量水体浊度、溶解氧、pH值及悬浮颗粒物深度的多参数海洋环境监测传感器组。"
    capabilities: ["水质监测", "浊度测量", "溶解氧检测"]

  cable_protection_tool:
    name: "海缆保护施工工具"
    aliases: ["海缆保护施工工具", "海缆保护工装", "套管安装工具"]
    description: "用于在海底管道或电缆交汇处安装防护套管、预制混凝土软体压块的水下施工专用工装。"
    capabilities: ["海缆防护", "软体压块敷设", "防护套管安装"]

  chassis_skid_module:
    name: "履带与滑橇组件"
    aliases: ["履带组件", "滑橇组件", "海床行走履带", "水下挂载滑橇"]
    description: "提供海底底质作业行走履带机构或模块化挂载工具滑橇，增强机器人在软泥海床的沉陷抵抗力与工具挂载能力。"
    capabilities: ["海床行走", "工具挂载", "底质承载"]


