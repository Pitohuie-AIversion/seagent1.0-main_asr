# ==============================================================================
# 支持船只知识库 — 可扩展
# ==============================================================================

vessels:
  - id: "海洋石油681"
    aliases: ["681", "HYSY681", "海油681"]
    full_name: "海洋石油681"
    type: "DSV"
    description: "深水综合作业船，配备动力定位系统DP3，支持饱和潜水和ROV作业，适用深水管缆巡检及干预任务。"
    available: true

  - id: "DSV-Oceanic"
    aliases: ["Oceanic", "oceanic", "大洋"]
    full_name: "DSV-Oceanic"
    type: "DSV"
    description: "外籍深水支持船，动力定位DP2，主要承担深水ROV干预作业支持，携带重型工作级ROV。"
    available: true

  - id: "海洋石油286"
    aliases: ["286", "HYSY286"]
    full_name: "海洋石油286"
    type: "SURVEY"
    description: "综合物探船，适合管缆调查、海底测量等观察作业支持任务。"
    available: true

  - id: "海洋石油708"
    aliases: ["708", "HYSY708"]
    full_name: "海洋石油708"
    type: "DSV"
    description: "深水铺管起重船，配备ROV支持系统，适合深水安装及干预作业。"
    available: false   # 当前不可用


# ==============================================================================
# 管缆类型配置 — 可扩展
# ==============================================================================

cable_types:
  - id: "submarine_pipeline"
    label: "海底油气管道"
    aliases: ["油气管道", "管道", "输油管", "油管", "气管", "submarine pipeline"]
  - id: "power_cable"
    label: "电力电缆"
    aliases: ["电缆", "电力缆", "power cable", "电力线"]
  - id: "fiber_optic"
    label: "光纤通信缆"
    aliases: ["光纤", "光缆", "通信缆", "fiber", "optical cable"]


# ==============================================================================
# 任务工具知识 — 仅用于回答“某类任务常用/建议工具”类问题
# 最终 JSON 中 payload 字段的合法值来自 robot_fleet.yaml 的 supported_payloads
# ==============================================================================

payload_options:

  # ============================================================================
  # 管缆巡检
  #
  # 任务链路：
  # 管缆发现与识别 → 管缆表面观察 → 缺陷检测 → 尺寸或缺陷确认
  # ============================================================================
  pipeline_inspection:
    common:
      - "高清水下摄像机"
      - "LED水下照明灯"
      - "成像声呐"
      - "多波束声呐"
      - "电磁检测传感器"
      - "腐蚀检测探头"
      - "厚度检测传感器"
      - "泄漏检测传感器"
      - "激光标尺"

    description: >
      管缆巡检任务专用载荷，主要用于管缆目标发现与识别、
      管缆表面状态观察、腐蚀和壁厚等缺陷检测，以及异常尺寸测量。


  # ============================================================================
  # 管缆埋设
  #
  # 任务链路：
  # 管缆识别与跟踪 → 海床开沟或喷冲 → 管缆压入 → 埋深闭环控制
  # ============================================================================
  pipeline_burial:
    common:
      - "高清水下摄像机"
      - "LED水下照明灯"
      - "TSS管缆跟踪传感器"
      - "高压水射流喷冲埋设模块"
      - "海缆压埋装置"
      - "埋深控制装置"
      - "机械切割开沟模块"
      - "海床地质探测设备"
    description: >
      管缆埋设任务专用载荷，主要用于管缆识别与路径跟踪、
      海床喷冲或机械开沟、管缆压埋以及埋深闭环控制。
      机械切割开沟模块和海床地质探测设备根据海床底质选择。


  # ============================================================================
  # 采油树控制面板阀门操作
  #
  # 任务链路：
  # 面板与阀门识别 → 阀门空间位置判断 → 机械臂接近
  # → 末端执行机构对接 → 插拔或操作 → 操作结果检查
  # ============================================================================
  tree_valve_operation:
    common:
      - "高清水下摄像机"
      - "LED水下照明灯"
      - "双目视觉模块"
      - "三维视觉系统"
      - "激光标尺"
      - "多功能液压机械臂"
      - "电液机械臂"
      - "夹爪"
      - "泄漏检测传感器"

    description: >
      采油树控制面板阀门操作任务专用载荷，
      主要用于操作面板和阀门目标识别、空间位姿判断、
      机械臂运动操作、末端执行机构对接，以及操作后的泄漏检查。


# ==============================================================================
# 通用输出约束引用表 — payload 不再通过此处约束
# ==============================================================================

# vessel_ids: 所有支持船的合法 id（与 vessels[].id 保持同步）
vessel_ids:
  - "海洋石油681"
  - "DSV-Oceanic"
  - "海洋石油286"
  - "海洋石油708"
