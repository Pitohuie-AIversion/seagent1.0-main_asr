# ==============================================================================
# 支持船只知识库 — 可扩展
# ==============================================================================

vessels:
  - id: "海洋石油681"
    aliases: ["681", "HYSY681", "海油681"]
    full_name: "海洋石油681"
    type: "DSV"
    description: "深水综合作业船，配备动力定位系统DP3，支持饱和潜水和ROV作业，适用深水管缆巡检及干预任务。"
    available: true

  - id: "DSV-Oceanic"
    aliases: ["Oceanic", "oceanic", "大洋"]
    full_name: "DSV-Oceanic"
    type: "DSV"
    description: "外籍深水支持船，动力定位DP2，主要承担深水ROV干预作业支持，携带重型工作级ROV。"
    available: true

  - id: "海洋石油286"
    aliases: ["286", "HYSY286"]
    full_name: "海洋石油286"
    type: "SURVEY"
    description: "综合物探船，适合管缆调查、海底测量等观察作业支持任务。"
    available: true

  - id: "海洋石油708"
    aliases: ["708", "HYSY708"]
    full_name: "海洋石油708"
    type: "DSV"
    description: "深水铺管起重船，配备ROV支持系统，适合深水安装及干预作业。"
    available: false   # 当前不可用


# ==============================================================================
# 管缆类型配置 — 可扩展
# ==============================================================================

cable_types:
  - id: "submarine_pipeline"
    label: "海底油气管道"
    aliases: ["油气管道", "管道", "输油管", "油管", "气管", "submarine pipeline"]
  - id: "power_cable"
    label: "电力电缆"
    aliases: ["电缆", "电力缆", "power cable", "电力线"]
  - id: "fiber_optic"
    label: "光纤通信缆"
    aliases: ["光纤", "光缆", "通信缆", "fiber", "optical cable"]


# ==============================================================================
# 任务工具知识 — 仅用于回答“某类任务常用/建议工具”类问题
# 最终 JSON 中 payload 字段的合法值来自 robot_fleet.yaml 的
# onboard_payloads 与 supported_payloads 并集
# ==============================================================================

payload_options:

  # ============================================================================
  # 管缆巡检
  #
  # 任务链路：
  # 管缆发现与识别 → 管缆表面观察 → 缺陷检测 → 尺寸或缺陷确认
  # ============================================================================
  pipeline_inspection:
    common:
      - "高清水下摄像机"
      - "LED水下照明灯"
      - "成像声呐"
      - "多波束声呐"
      - "电磁检测传感器"
      - "腐蚀检测探头"
      - "厚度检测传感器"
      - "泄漏检测传感器"
      - "激光标尺"

    description: >
      管缆巡检任务专用载荷，主要用于管缆目标发现与识别、
      管缆表面状态观察、腐蚀和壁厚等缺陷检测，以及异常尺寸测量。


  # ============================================================================
  # 管缆埋设
  #
  # 任务链路：
  # 管缆识别与跟踪 → 海床开沟或喷冲 → 管缆压入 → 埋深闭环控制
  # ============================================================================
  pipeline_burial:
    common:
      - "高清水下摄像机"
      - "LED水下照明灯"
      - "TSS管缆跟踪传感器"
      - "高压水射流喷冲埋设模块"
      - "海缆压埋装置"
      - "埋深控制装置"
      - "机械切割开沟模块"
      - "海床地质探测设备"
    description: >
      管缆埋设任务专用载荷，主要用于管缆识别与路径跟踪、
      海床喷冲或机械开沟、管缆压埋以及埋深闭环控制。
      机械切割开沟模块和海床地质探测设备根据海床底质选择。


  # ============================================================================
  # 采油树控制面板阀门操作
  #
  # 任务链路：
  # 面板与阀门识别 → 阀门空间位置判断 → 机械臂接近
  # → 末端执行机构对接 → 插拔或操作 → 操作结果检查
  # ============================================================================
  tree_valve_operation:
    common:
      - "高清水下摄像机"
      - "LED水下照明灯"
      - "双目视觉模块"
      - "三维视觉系统"
      - "激光标尺"
      - "多功能液压机械臂"
      - "电液机械臂"
      - "夹爪"
      - "泄漏检测传感器"

    description: "采油树操作面板插拔任务载荷，限定为通用工作级深海机器人中声明的机械臂、视觉、声学、导航定位和状态感知硬件。"


# ==============================================================================
# 载荷/工具目录与功能说明 — 供 TOOL_QUERY 和 KNOWLEDGE_QA 检索
# ==============================================================================

payload_catalog:
  multi_function_hydraulic_arm:
    name: "多功能液压机械臂"
    aliases: ["多功能机械臂", "液压机械臂"]
    description: "多自由度高负载液压抓取与干预工具，用于水下采油树控制面板阀门操作、插拔面板、清理障碍物及重型水下工装抓握。"
    capabilities: ["插拔", "抓取", "阀门拧转", "水下干预"]

  side_scan_sonar:
    name: "侧扫声呐"
    aliases: ["侧扫声呐", "侧扫声纳"]
    description: "利用水声发射和接收原理对海底两侧进行高分辨率声学成像的设备，主要用于大面积海底地貌扫描、管缆悬空/埋设巡检及水下目标物搜寻。"
    capabilities: ["声学成像", "海底扫测", "管缆路由巡检", "目标物搜寻"]

  forward_looking_sonar:
    name: "前视声呐"
    aliases: ["前视声呐", "前视声纳", "避障声呐"]
    description: "用于机器人前方水域远距离障碍物探测、地形识别与水下碰撞预警的声学感知设备。"
    capabilities: ["水下避障", "前方地形探测", "导航辅助"]

  imaging_sonar:
    name: "成像声呐"
    aliases: ["成像声呐", "二维成像声呐", "三维成像声呐"]
    description: "在高浑浊度或低能见度水下环境中提供近距离高清晰度二维/三维声学图像，辅助机械臂对准与结构件精确定位。"
    capabilities: ["高浑浊度成像", "精确定位辅助", "水下近景观测"]

  hd_camera:
    name: "高清水下摄像机"
    aliases: ["摄像机", "高清摄像机", "水下摄像机"]
    description: "提供水下高分辨率光学彩色画面，用于管缆外观腐蚀检测、油田水下结构件近距离外观巡检与作业过程实时监控。"
    capabilities: ["光学巡检", "外观检测", "实时作业监控"]

  led_lighting:
    name: "LED水下照明灯"
    aliases: ["LED水下照明灯", "LED照明系统", "水下灯", "照明灯"]
    description: "为深海无光或微光环境提供强光补光，确保摄像机和光学视觉系统获得清晰画面。"
    capabilities: ["水下补光", "夜间/深海照明"]

  laser_scaling:
    name: "激光标尺"
    aliases: ["激光标尺", "激光测量仪"]
    description: "通过在被测物体表面投影已知间距的激光光点，辅助水下摄像机进行测量与尺寸评估。"
    capabilities: ["尺寸测量", "裂纹测量", "距离标定"]

  ins_nav:
    name: "INS惯性导航系统"
    aliases: ["INS", "惯导", "INS惯性导航系统", "惯性导航"]
    description: "高精度自主定位与姿态测量设备，提供水下机器人的三维位置、姿态角和角速度推算。"
    capabilities: ["高精度定位", "姿态测量", "无缝导航推算"]

  dvl:
    name: "DVL多普勒测速仪"
    aliases: ["DVL", "多普勒测速仪", "DVL底锁"]
    description: "通过声学多普勒效应测量水下机器人相对于海床（底锁）或水体（水锁）的载体三维运动速度，有效抑制惯导漂移。"
    capabilities: ["底锁测速", "悬停定点", "速度推算"]

  usbl:
    name: "USBL定位设备"
    aliases: ["USBL", "超短基线", "USBL超短基线定位系统", "USBL定位"]
    description: "利用母船声学换能器与机器人水下应答器进行相位差与时延测量，提供机器人相对于母船的绝对三维坐标。"
    capabilities: ["母船相对定位", "绝对三维定位", "目标追踪"]

  depth_sensor:
    name: "深度传感器"
    aliases: ["深度计", "深度传感器", "高度计"]
    description: "通过高精度压力感应测量机器人当前所在的水深与离底高度，支持自动定深与定高悬浮作业。"
    capabilities: ["水深测量", "定深控制", "离底高度测量"]

  tss_cable_tracker:
    name: "TSS管缆跟踪传感器"
    aliases: ["TSS", "TSS管缆跟踪传感器", "管缆探测仪"]
    description: "利用电磁感应原理探测埋入海床底质下方的金属管缆或通电电缆，实时测量管缆的平面偏航与埋深。"
    capabilities: ["埋深测量", "电磁管缆跟踪", "路由定位"]

  high_pressure_water_jet:
    name: "高压水射流喷冲埋设模块"
    aliases: ["水射流", "喷冲埋设", "高压水射流喷冲埋设模块"]
    description: "通过高压水流冲刷松散海床土壤开辟沟槽，将海底管缆顺畅埋入泥面以下指定深度。"
    capabilities: ["开沟埋设", "土壤冲刷", "海缆埋设"]

  multibeam_sonar:
    name: "多波束声呐"
    aliases: ["多波束声纳", "多波束测深声呐"]
    description: "通过多个声学波束对海床和水下目标进行条带式测量与成像，用于地形测绘、目标轮廓获取和管缆路由调查。"
    capabilities: ["海床测绘", "地形测量", "目标轮廓成像"]

  electromagnetic_detector:
    name: "电磁检测传感器"
    aliases: ["电磁检测仪", "电磁传感器"]
    description: "利用电磁响应检测金属管缆的位置或异常特征，用于管缆跟踪和缺陷辅助判断。"
    capabilities: ["金属管缆探测", "路由跟踪", "异常检测"]

  corrosion_probe:
    name: "腐蚀检测探头"
    aliases: ["腐蚀探头", "腐蚀检测传感器"]
    description: "用于采集水下金属结构或管缆表面的腐蚀相关信号，辅助评估腐蚀位置和程度。"
    capabilities: ["腐蚀检测", "表面状态评估"]

  thickness_sensor:
    name: "厚度检测传感器"
    aliases: ["厚度传感器", "壁厚检测传感器"]
    description: "用于测量管道或水下结构件的材料厚度，辅助识别减薄、磨损和腐蚀缺陷。"
    capabilities: ["壁厚测量", "减薄检测", "缺陷评估"]

  leak_detector:
    name: "泄漏检测传感器"
    aliases: ["泄漏传感器", "泄漏检测仪"]
    description: "用于感知管缆或水下设施周边的泄漏迹象，为异常定位和风险确认提供检测信息。"
    capabilities: ["泄漏检测", "异常定位", "风险监测"]

  cable_burial_device:
    name: "海缆压埋装置"
    aliases: ["压埋装置", "海缆压埋设备"]
    description: "用于在开沟或喷冲后引导海缆进入沟槽并完成压埋，支持管缆埋设作业。"
    capabilities: ["海缆压埋", "入沟引导"]

  burial_depth_controller:
    name: "埋深控制装置"
    aliases: ["埋深控制器", "埋深闭环控制装置"]
    description: "根据埋深测量结果调节埋设作业参数，使管缆埋深保持在任务要求范围内。"
    capabilities: ["埋深测量反馈", "闭环控制"]

  mechanical_trenching_module:
    name: "机械切割开沟模块"
    aliases: ["机械开沟模块", "切割开沟模块"]
    description: "通过机械切割方式破开较硬海床并形成沟槽，用于不适合单纯水射流喷冲的埋设工况。"
    capabilities: ["机械开沟", "硬质海床切割"]

  seabed_geology_detector:
    name: "海床地质探测设备"
    aliases: ["海床地质探测仪", "海床地质传感器"]
    description: "用于获取海床底质和浅层地质信息，为开沟方式选择及埋设参数设置提供依据。"
    capabilities: ["海床底质探测", "浅层地质调查", "施工辅助"]

  stereo_vision_module:
    name: "双目视觉模块"
    aliases: ["双目相机", "双目视觉"]
    description: "通过双摄像头获取目标的深度与空间信息，用于目标识别、距离估计和机械臂对准。"
    capabilities: ["立体视觉", "距离估计", "目标定位"]

  three_dimensional_vision:
    name: "三维视觉系统"
    aliases: ["3D视觉系统", "三维视觉"]
    description: "融合视觉或深度信息构建目标区域的三维表示，用于结构识别、姿态估计和精细操作定位。"
    capabilities: ["三维重建", "姿态估计", "精细定位"]

  electro_hydraulic_arm:
    name: "电液机械臂"
    aliases: ["电液作业机械臂", "电液操作臂"]
    description: "采用电液驱动执行水下抓取、插拔和阀门操作，为精细干预任务提供稳定的操作能力。"
    capabilities: ["抓取", "插拔", "阀门操作", "水下干预"]

  gripper:
    name: "夹爪"
    aliases: ["机械夹爪", "抓手"]
    description: "安装在机械臂末端，用于夹持、抓取和固定水下目标或作业工具。"
    capabilities: ["夹持", "抓取", "目标固定"]

