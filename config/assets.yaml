    description: "搭载俯仰和旋转云台机构的水下高清晰度相机，用于全方位灵活观察水下作业死角与精细结构。"
    capabilities: ["多角度视觉观测", "死角巡检", "姿态可控监控"]

  led_lighting:
    name: "LED水下照明灯"
    aliases: ["LED水下照明灯", "LED照明系统", "水下灯", "照明灯"]
    description: "为深海无光或微光环境提供强光补光，确保摄像机和光学视觉系统获得清晰画面。"
    capabilities: ["水下补光", "夜间/深海照明"]

  laser_scaling:
    name: "激光标尺"
    aliases: ["激光标尺", "激光测量仪"]
