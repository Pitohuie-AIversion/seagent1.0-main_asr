    capabilities: ["声学成像", "海底扫测", "管缆路由巡检", "目标物搜寻"]

  forward_looking_sonar:
    name: "前视声呐"
    aliases: ["前视声呐", "前视声纳", "避障声呐"]
    description: "用于机器人前方水域远距离障碍物探测、地形识别与水下碰撞预警的声学感知设备。"
    capabilities: ["水下避障", "前方地形探测", "导航辅助"]

  imaging_sonar:
    name: "成像声呐"
    aliases: ["成像声呐", "二维成像声呐", "三维成像声呐"]
    description: "在高浑浊度或低能见度水下环境中提供近距离高清晰度二维/三维声学图像，辅助机械臂对准与结构件精确定位。"
    capabilities: ["高浑浊度成像", "精确定位辅助", "水下近景观测"]

  hd_camera:
    name: "高清水下摄像机"
    aliases: ["摄像机", "高清摄像机", "水下摄像机"]
    description: "提供水下高分辨率光学彩色画面，用于管缆外观腐蚀检测、油田水下结构件近距离外观巡检与作业过程实时监控。"
    capabilities: ["光学巡检", "外观检测", "实时作业监控"]

  pan_tilt_camera:
